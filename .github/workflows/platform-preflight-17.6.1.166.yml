          # Run scope ownership. Pure decision functions (no system access) and one observer; cleanup.py imports this file.
          # A scope is this run's only when three independent records name the same invocation: the ID systemd-run handed to
          # the launcher it started, the unit's InvocationID property, and the trusted.invocation_id xattr of the cgroup at the
          # only accepted path; and the kernel shows the launcher at that cgroup before anything in the tree has changed.
          import os, re, subprocess, sys
          UNIT = "pf530.scope"; EXP_CG = "/system.slice/pf530.scope"
          HEX = re.compile(r"[0-9a-f]{32}")
          LOADS = ("loaded", "not-found", "error", "masked", "bad-setting", "merged", "stub")
          ACTIVES = ("active", "inactive", "activating", "deactivating", "failed", "reloading", "maintenance")
          def prop(unit, name):  # the value, or None when it cannot be read
              try:
                  r = subprocess.run(["systemctl", "show", "-p", name, "--value", unit], capture_output=True, text=True, timeout=15)
              except (OSError, subprocess.SubprocessError):
                  return None
              return r.stdout.strip() if r.returncode == 0 else None
          def xattr(path):  # 'absent' (no cgroup there), 'none' (cgroup without an ID), the ID, or None when unreadable
              try:
                  v = os.getxattr(path, "trusted.invocation_id")
              except FileNotFoundError:
                  return "absent"
              except OSError as e:
                  return "none" if e.errno == 61 else None
              return v.decode("ascii", "replace").strip("\0")
          def observe(unit):
              return prop(unit, "LoadState"), prop(unit, "ActiveState"), prop(unit, "InvocationID"), xattr("/sys/fs/cgroup" + EXP_CG)
          def decide_start(claim, spawn_pid, load, active, p_inv, p_cg, x_inv, pid_cg):
              if claim is None:
                  return "launcher_claim_absent", None
              t = claim.split()
              if len(t) != 2 or not t[0].isdigit() or not HEX.fullmatch(t[1]):
                  return "launcher_claim_invalid", None
              if spawn_pid is None or t[0] != spawn_pid:
                  return "launcher_pid_mismatch", None
              if None in (load, active, p_inv, p_cg, x_inv, pid_cg):
                  return "identity_unreadable", None
              if load != "loaded" or active != "active":
                  return "unit_not_active", None
              if p_cg != EXP_CG:
                  return "unit_path_unexpected", None
              if p_inv != t[1]:
                  return "identity_mismatch_unit", None
              if x_inv in ("absent", "none"):
                  return "cgroup_identity_missing", None
              if x_inv != t[1]:
                  return "identity_mismatch_cgroup", None
              if pid_cg == "absent":
                  return "launcher_gone", None
              if pid_cg != "0::%s\n" % EXP_CG:
                  return "launcher_not_at_scope_root", None
              return "owned", t[1]
          def wellformed(load, active, p_inv, x_inv):  # every observed value from its known form, or the observation is not used
              if load == "not-found" and (active != "inactive" or p_inv not in ("", "0" * 32)):
                  return False
              return load in LOADS and active in ACTIVES and (p_inv == "" or bool(HEX.fullmatch(p_inv))) and \
                  (x_inv in ("absent", "none") or bool(HEX.fullmatch(x_inv)))
          def gone(rec_inv, load, active, p_inv, x_inv):
              # positive evidence that the run's scope no longer exists: no cgroup at the only accepted path, and either no unit
              # under the name or only our own invocation, ended. A cgroup still present (with any or no ID) is never "gone",
              # and a process count of zero is not evidence that a remaining empty cgroup has been removed.
              return x_inv == "absent" and (load == "not-found" or (p_inv == rec_inv and active in ("inactive", "failed")))
          def decide_cleanup(rec_inv, load, active, p_inv, x_inv):  # (action, state); action is 'stop' only for a proven scope
              if rec_inv is None or not HEX.fullmatch(rec_inv):
                  return "none", "record_invalid"
              if None in (load, active, p_inv, x_inv):
                  return "none", "unreadable"
              if not wellformed(load, active, p_inv, x_inv):
                  return "none", "malformed"
              if gone(rec_inv, load, active, p_inv, x_inv):
                  return "none", "absent"
              if p_inv == rec_inv and x_inv == rec_inv:
                  return "stop", "owned"
              return "none", "identity_mismatch"
          def verify_scope(rec_inv, load, active, p_inv, x_inv):  # (verified, state): verified only on positive evidence
              if None in (load, active, p_inv, x_inv):
                  return False, "unverifiable"
              if rec_inv is None or not HEX.fullmatch(rec_inv):
                  return False, "record_invalid"
              if not wellformed(load, active, p_inv, x_inv):
                  return False, "malformed"
              if gone(rec_inv, load, active, p_inv, x_inv):
                  return True, "absent"
              if x_inv == rec_inv or (p_inv == rec_inv and active not in ("inactive", "failed")):
                  return False, "present"
              # anything else (cgroup left without an ID, unit and cgroup naming other or different IDs, a replacement that may
              # or may not be someone else's) is not resolved here and stays unverified
              return False, "unresolved_identity"
          def verify_unproven(load, active, p_inv, x_inv):  # an intent without a proven identity: never acted on
              if None in (load, active, p_inv, x_inv):
                  return False, "unverifiable"
              if not wellformed(load, active, p_inv, x_inv):
                  return False, "malformed"
              if load == "not-found" and x_inv == "absent":
                  return True, "absent"
              return False, "present_identity_unproven"
          if __name__ == "__main__":
              rr = sys.argv[2]
              def rd(n):
                  try:
                      return open(os.path.join(rr, n)).read().strip()
                  except FileNotFoundError:
                      return None
              claim, sp = rd("launcher.claim"), rd("launcher.spawn.pid")
              pid = claim.split()[0] if claim and claim.split() and claim.split()[0].isdigit() else None
              pid_cg = None
              if pid:
                  try:
                      pid_cg = open("/proc/%s/cgroup" % pid).read()
                  except FileNotFoundError:
                      pid_cg = "absent"
                  except OSError:
                      pid_cg = None
              load, active, p_inv, x_inv = observe(UNIT)
              code, inv = decide_start(claim, sp, load, active, p_inv, prop(UNIT, "ControlGroup"), x_inv, pid_cg)
              open(os.path.join(rr, "scope.verdict"), "w").write(code + "\n")
              print("STEP2 run_scope ownership=%s" % code)
              if code != "owned":
                  sys.exit(3)
              open(os.path.join(rr, "scope.verified"), "w").write(inv + "\n")
              print("STEP2 run_scope unit=%s path=%s invocation_sources=launcher,unit,cgroup_xattr agree=yes launcher_at_scope_root=yes" % (UNIT, EXP_CG))
          PY

