          # 2b. the run scope, only with proven ownership: stopping it ends every process left in its cgroup subtree
          #     (engines, shims, containers) and systemd then removes the subtree. Any other state: no action.
          #     systemctl stops by name only: the identity read just before the stop cannot be bound to the stop request itself.
          for _, u, d in rec("scope"):
              act, state = own.decide_cleanup(d.get("inv"), *own.observe(u))
              if act == "stop":
                  run("scope_stop_" + u, ["systemctl", "stop", u])
              else:
                  print("CLEANUP scope=%s %s no_action" % (u, state))
          # 3. paths, newest first, each only if its recorded inode still matches
          for _, p, d in reversed(rec("path")):
              cur = ino(p)
              if cur is None:
                  print("CLEANUP path=%s already_absent" % p); continue
              if cur != d.get("ino"):
                  print("CLEANUP path=%s identity_mismatch no_action" % p); continue
              if p == "/etc/netns":
                  run("rmdir_" + p, ["rmdir", p])
              elif os.path.isdir(p) and not os.path.islink(p):
                  run("rm_" + p, ["rm", "-rf", "--one-file-system", p])
              else:
                  run("rm_" + p, ["rm", "-f", p])
          # 4. the test user and its group, only with the recorded uid/gid
          for _, u, d in rec("user"):
              try:
                  pw = pwd.getpwnam(u)
                  if str(pw.pw_uid) == d.get("uid"):
                      run("userdel_" + u, ["userdel", u])
                  else:
                      print("CLEANUP user=%s identity_mismatch no_action" % u)
              except KeyError:
                  print("CLEANUP user=%s already_absent" % u)
              try:
                  g = grp.getgrnam(u)
                  if str(g.gr_gid) == d.get("gid"):
                      run("groupdel_" + u, ["groupdel", u])
                  else:
                      print("CLEANUP group=%s identity_mismatch no_action" % u)
              except KeyError:
                  pass
          # 5. positive verification
          ent = parse()
          if rec("engine"):
              # a failed inventory stays in the tally unless the independent on-disk inventory exists;
              # either way the process check below looks for every inventoried container id
              note_ok = inv_api is not None or inv_disk is not None
              print("VERIFY container_inventory api=%s disk=%s %s" % ("ok" if inv_api is not None else "unavailable",
                    "ok" if inv_disk is not None else "unavailable", "verified" if note_ok else "UNVERIFIED"))
              unverified += not note_ok
          def note(item, ok, state):
              global unverified
              unverified += not ok
              print("VERIFY %s %s %s" % (item, state, "verified" if ok else "UNVERIFIED"))
          done = {(k, n) for k, n, _ in ent}
          for _, _, d in rec("intent"):
              k, t = d.get("kind"), d.get("target")
              if (k, t) not in done and k == "scope":
                  ok, state = own.verify_unproven(*own.observe(t))
                  note("unproven_scope:" + t, ok, state)
              elif (k, t) not in done:
                  exists = (ino(t) is not None) if k == "path" else (nsino(t) is not None) if k == "netns" else (t in [p.pw_name for p in pwd.getpwall()])
                  note("unproven_%s:%s" % (k, t), not exists, "present_identity_unproven" if exists else "absent")
          for k, n, d in ent:
              if k == "path":
                  note("path:" + n, ino(n) is None, "absent" if ino(n) is None else "present")
              elif k == "netns":
                  note("netns:" + n, nsino(n) is None, "absent" if nsino(n) is None else "present")
              elif k == "user":
                  present = n in [p.pw_name for p in pwd.getpwall()] or n in [g.gr_name for g in grp.getgrall()]
                  note("user_and_group:" + n, not present, "present" if present else "absent")
              elif k == "scope":
                  ok, state = own.verify_scope(d.get("inv"), *own.observe(n))
                  note("scope:" + n, ok, state)
          nsi = [d.get("ino") for k, _, d in ent if k == "netns"]
          cids = [d.get("id") for k, _, d in ent if k == "container"]
          cgs = [d.get("cg") for k, _, d in ent if k == "scope"]
          procs = 0
          for p in os.listdir("/proc"):
              if not p.isdigit():
                  continue
              try:
                  cmd = open("/proc/%s/cmdline" % p, "rb").read().replace(b"\0", b" ").decode("utf-8", "replace")
                  cg = open("/proc/%s/cgroup" % p).read()
                  net = os.readlink("/proc/%s/ns/net" % p)
              except OSError:
                  continue
              if (R in cmd or RR in cmd) or any(c and c in cg for c in cids) or any(i and net == "net:[%s]" % i for i in nsi) \
                      or any(s and ("0::%s\n" % s in cg or "0::%s/" % s in cg) for s in cgs):
                  procs += 1
          note("processes_of_run", procs == 0, "count=%d" % procs)
          mounts = [l.split()[4] for l in open("/proc/self/mountinfo").read().splitlines()]
          left = [m for m in mounts if m.startswith((R, RR, "/run/netns/pf530", "/etc/netns/pf530"))]
          note("mounts_of_run", not left, "count=%d" % len(left))
          stop = open(os.path.join(rt, "stop_reason")).read().strip() if os.path.exists(os.path.join(rt, "stop_reason")) else "none"
          print("STEP6 original_stop=%s cleanup_action_errors=%d unverified=%d" % (stop, errors, unverified))
          sys.exit(0 if errors == 0 and unverified == 0 else 1)
          PY

          . "$RT/lib.sh"
          for f in lib.sh regfetch.py probe.py engines.sh cfg.py diag.py own.py measure.sql compare.py cleanup.py; do
            echo "STEP0 helper $f sha256=$(sha256sum "$RT/$f" | cut -c1-64)"
          done
          # runs 1 and 2 of this workflow file consumed the first two authorizations; only run number 3, attempt 1 is accepted here.
          # Any other dispatch (4, 5, ...) or any re-run attempt (3/2, ...) stops before any fetch or creation.
          case "$GITHUB_RUN_NUMBER" in ''|*[!0-9]*) rn=invalid ;; *) rn="$GITHUB_RUN_NUMBER" ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) ra=invalid ;; *) ra="$GITHUB_RUN_ATTEMPT" ;; esac
          [ "$rn" = "3" ] && [ "$ra" = "1" ] || stop "STOP0 not_the_authorized_run run_number=$rn run_attempt=$ra accepted_only=3/1"
          [ "$RUNNER_OS" = "Linux" ] && [ "$RUNNER_ARCH" = "X64" ] || stop "STOP0 unexpected_runner"
          # no checkout: the workspace must be empty
          [ -z "$(ls -A "$GITHUB_WORKSPACE")" ] || stop "STOP0 workspace_not_empty"
          for t in ip python3 containerd dockerd docker ss setpriv useradd userdel groupdel curl sha256sum tar stat mount unshare systemd-run systemctl; do
            sudo sh -c 'command -v "$1"' sh "$t" >/dev/null || stop "STOP0 tool_missing $t"
          done
          python3 -I -c 'import tomllib' || stop "STOP0 python_without_tomllib"
          echo "STEP0 runner=Linux/X64 workspace_empty=yes run_number=$rn run_attempt=$ra accepted_only=3/1"
          echo "STEP0 versions python=$(python3 -I -c 'import platform; print(platform.python_version())') containerd=$(containerd --version | cut -d' ' -f3) dockerd=$(dockerd --version | cut -d' ' -f3 | tr -d ,) systemd=$(systemctl --version | sed -n '1s/^systemd \([0-9]*\).*/\1/p') kernel=$(uname -r)"

      # ------------------------------------------------------------------ 1. fetch (host network, before any isolation)
      - name: 1-fetch-and-verify
        timeout-minutes: 15
        run: |
          . "$RUNNER_TEMP/lib.sh"
          F="$RT/fetch"
          led "intent pf530 kind=path target=$F"; mkdir "$F" || stop "STOP1 fetch_dir_exists"; led "path $F ino=$(stat -c %i "$F")"
          cd "$F"
          curl -fsSL --retry 3 -o cli.tar.gz "$CLI_URL" || stop "STOP1 cli_download"
          echo "$CLI_SHA256  cli.tar.gz" | sha256sum -c --status - || stop "STOP1 cli_sha256_mismatch"
          members="$(tar -tzf cli.tar.gz)" || stop "STOP1 cli_archive_unreadable"
          [ "$members" = "supabase" ] || stop "STOP1 cli_archive_members"
          tar -xzf cli.tar.gz supabase || stop "STOP1 cli_extract"
          [ ! -e /usr/local/bin/supabase-pf ] || stop "STOP1 cli_target_exists"
          led "intent pf530 kind=path target=/usr/local/bin/supabase-pf"
          sudo install -o root -g root -m 0755 supabase /usr/local/bin/supabase-pf || stop "STOP1 cli_install"
          led "path /usr/local/bin/supabase-pf ino=$(stat -c %i /usr/local/bin/supabase-pf)"
          v="$(env -i PATH=/usr/bin:/bin HOME="$F" DO_NOT_TRACK=1 SUPABASE_TELEMETRY_DISABLED=1 /usr/local/bin/supabase-pf --version)" || stop "STOP1 cli_version_query"
          [ "$v" = "$CLI_VERSION" ] || stop "STOP1 cli_version_mismatch"
          echo "STEP1 cli sha256=verified members=supabase version=$v"
          mkdir "$F/img"
          set +e; python3 -I "$RT/regfetch.py" "$IMAGE_NAME" "$IMAGE_INDEX" "$IMAGE_AMD64" "$F/img" "$IMAGE_NAME:$PG_PIN"; rc=$?; set -e
          case "$rc" in 0) ;; 3) stop "STOP1 image_identity_mismatch" ;; *) stop "STOP1 image_fetch_tool_error rc=$rc" ;; esac

      # ------------------------------------------------------------------ 2. boundary + dedicated engine, verified before any database
      - name: 2-isolate
        timeout-minutes: 8
        run: |
          . "$RUNNER_TEMP/lib.sh"
          # 2a. nothing of this run may pre-exist
          if getent passwd "$TU" >/dev/null || getent group "$TU" >/dev/null; then stop "STOP2 test_user_or_group_exists"; fi
          [ ! -e "/run/netns/$NS" ] || stop "STOP2 netns_exists"
          for p in "$R" "$RR" "$EN"; do [ ! -e "$p" ] || stop "STOP2 path_exists $p"; done
          hfs="$(stat -f -c %T /sys/fs/cgroup)" || stop "STOP2 host_cgroup_unreadable"
          [ "$hfs" = "cgroup2fs" ] || stop "STOP2 host_cgroup_not_v2"
          uls="$(systemctl show -p LoadState --value "$UNIT")" || stop "STOP2 run_scope_state_unreadable"
          [ "$uls" = "not-found" ] || stop "STOP2 run_scope_name_in_use"
          # 2b. test user: own group only, no docker group, no login
          led "intent pf530 kind=user target=$TU"
          sudo useradd --system --user-group --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin "$TU" || stop "STOP2 useradd"
          id -u "$TU" > "$RT/uid"; id -g "$TU" > "$RT/gid"
          led "user $TU uid=$(cat "$RT/uid") gid=$(cat "$RT/gid")"
          [ "$(id -G "$TU")" = "$(cat "$RT/gid")" ] || stop "STOP2 test_user_groups"
          # 2c. run-owned paths, each recorded with its inode
          if [ ! -d /etc/netns ]; then mkown /etc/netns 0755; fi
          mkown "$R" 0711; mkown "$RR" 0711; mkown "$EN" 0755
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' | sudo tee "$EN/resolv.conf" >/dev/null
          # name service without the host resolver socket: files, then the (unreachable) DNS above
          printf 'passwd: files\ngroup: files\nshadow: files\nhosts: files dns\nnetworks: files\nprotocols: files\nservices: files\n' | sudo tee "$EN/nsswitch.conf" >/dev/null
          sudo mkdir -m 0700 "$R/containerd" "$R/docker" "$R/logs" "$RR/containerd"
          sudo mkdir -m 0711 "$R/work"
          sudo mkdir -m 0700 "$R/home" "$W"
          sudo chown "$(cat "$RT/uid"):$(cat "$RT/gid")" "$R/home" "$W"
          # 2d. network namespace with loopback only
          led "intent pf530 kind=netns target=$NS"
          sudo ip netns add "$NS" || stop "STOP2 netns_add"
          sudo stat -L -c %i "/run/netns/$NS" > "$RT/ns_ino"
          led "netns $NS ino=$(cat "$RT/ns_ino")"
          sudo ip -n "$NS" link set lo up || stop "STOP2 lo_up"
          echo "STEP2 step_shell_netns=$(readlink /proc/self/ns/net) test_netns=net:[$(cat "$RT/ns_ino")]"
          python3 -I "$RT/probe.py" host || true
          probe pre_engine STOP2
          # 2e. one launcher process starts both engines inside the namespace (one mount namespace for both), in the run's
          #     transient systemd scope with delegation and in its own cgroup namespace rooted at that scope.
          #     cgroupfs driver: on a cgroup v2 host running systemd the engine would otherwise default to the systemd driver
          #     and have container cgroups created by systemd outside the run's subtree.
          printf 'version = 2\ndisabled_plugins = ["io.containerd.grpc.v1.cri"]\n' | sudo tee "$R/containerd.toml" >/dev/null
          sudo tee "$R/daemon.json" >/dev/null <<'JSON'
          {"data-root": "/var/lib/pf530/docker", "exec-root": "/run/pf530/docker-exec", "pidfile": "/run/pf530/dockerd.pid",
           "hosts": ["unix:///run/pf530/docker.sock"], "group": "pf530", "containerd": "/run/pf530/containerd/containerd.sock",
           "containerd-namespace": "pf530", "containerd-plugins-namespace": "pf530-plugins",
           "storage-driver": "overlay2", "features": {"containerd-snapshotter": false}, "exec-opts": ["native.cgroupdriver=cgroupfs"],
           "dns": ["127.0.0.1"], "ipv6": false, "live-restore": false}
          JSON
          led "intent pf530 kind=scope target=$UNIT"
          # systemd-run starts the unit in mode "fail": an existing unit of that name makes it exit without starting anything
          sudo sh -c 'systemd-run --quiet --scope --collect --slice=system.slice --unit="$5" -p Delegate=yes -p TimeoutStopSec=30 -- unshare --cgroup -- ip netns exec "$1" sh "$2" "$3" "$4" </dev/null >/dev/null 2>"$4/launcher.err" & echo $! > "$4/launcher.spawn.pid"' sh "$NS" "$RT/engines.sh" "$R" "$RR" "$UNIT"
          # 2e'. bind the scope to this launcher before anything changes in its tree; the launcher waits for the answer
          for i in $(seq 30); do sudo test -s "$RR/launcher.claim" && break; sleep 1; done
          set +e; sudo python3 -I "$RT/own.py" start "$RR"; orc=$?; set -e
          if [ "$orc" != "0" ]; then
            sudo sh -c ': > "$1/cgroup.abort"' sh "$RR" || true
            sudo python3 -I "$RT/diag.py" engine - "$R" "$RR" "$(cat "$RT/ns_ino")" - not_checked || echo "DIAG engine tool_error"
            [ "$orc" = "3" ] && stop "STOP2 run_scope_not_owned"
            stop "STOP2 ownership_tool_error rc=$orc"
          fi
          inv="$(sudo cat "$RR/scope.verified")" || stop "STOP2 ownership_record_unreadable"
          led "scope $UNIT cg=$CGP inv=$inv"
          sudo sh -c 'printf "%s\n" "$1" > "$2/cgroup.go.tmp" && mv "$2/cgroup.go.tmp" "$2/cgroup.go"' sh "$inv" "$RR" || stop "STOP2 authorization_unwritable"
          for i in $(seq 90); do dk version >/dev/null 2>&1 && break; sleep 1; done
          # the decisive check is unchanged in effect; its status and stderr class are kept in memory only
          set +e; rerr="$(dk version 2>&1 >/dev/null)"; rrc=$?; set -e
          if [ "$rrc" != "0" ]; then
            case "$rerr" in
              *"permission denied"*) rcls=permission_denied ;;
              *"Cannot connect to the Docker daemon"*) rcls=daemon_unreachable ;;
              *"Error response from daemon"*) rcls=daemon_error_response ;;
              "") rcls=empty ;;
              *) rcls=other ;;
            esac
            sudo python3 -I "$RT/diag.py" engine - "$R" "$RR" "$(cat "$RT/ns_ino")" "$rrc" "$rcls" || echo "DIAG engine tool_error"
            stop "STOP2 dedicated_engine_not_ready"
          fi
          mnt=""; cns=""
          hcns="$(readlink /proc/self/ns/cgroup)" || stop "STOP2 step_cgroupns_unreadable"
          for n in launcher containerd dockerd; do
            pid="$(sudo cat "$RR/$n.spawn.pid")" || stop "STOP2 engine_pid_missing $n"
            net="$(sudo readlink "/proc/$pid/ns/net")" || stop "STOP2 engine_process_gone $n"
            m="$(sudo readlink "/proc/$pid/ns/mnt")" || stop "STOP2 engine_process_gone $n"
            c="$(sudo readlink "/proc/$pid/ns/cgroup")" || stop "STOP2 engine_process_gone $n"
            g="$(sudo cat "/proc/$pid/cgroup")" || stop "STOP2 engine_process_gone $n"
            [ "$net" = "net:[$(cat "$RT/ns_ino")]" ] || stop "STOP2 engine_outside_test_netns $n"
            [ -z "$mnt" ] || [ "$m" = "$mnt" ] || stop "STOP2 engines_in_different_mount_namespaces"
            [ "$c" != "$hcns" ] || stop "STOP2 engine_in_host_cgroup_namespace $n"
            [ -z "$cns" ] || [ "$c" = "$cns" ] || stop "STOP2 engines_in_different_cgroup_namespaces"
            [ "$g" = "0::$CGP/init" ] || stop "STOP2 engine_outside_run_scope $n"
            mnt="$m"; cns="$c"; echo "STEP2 $n pid=$pid netns=$net mntns=$m cgroupns=$c cgroup=run_scope/init"
          done
          led "engine pf530 launcher=$(sudo cat "$RR/launcher.spawn.pid") containerd=$(sudo cat "$RR/containerd.spawn.pid") dockerd=$(sudo cat "$RR/dockerd.spawn.pid") mnt=$mnt"
          echo "STEP2 step_shell_mntns=$(readlink /proc/self/ns/mnt)"
          # 2e''. the engines' resource view: their own record from inside, and the scope as the host sees it.
          #      A read is checked first; only a successful read can count as empty.
          cgv="$(sudo cat "$RR/cgroup.setup" "$RR/cgroupfs.type" "$RR/cgroup.self" "$RR/cgroup.view" | tr '\n' ' ')" || stop "STOP2 engine_cgroup_record_missing"
          [ "$cgv" = "ok cgroup2fs 0::/init init " ] || stop "STOP2 engine_cgroup_view_not_as_declared"
          rp="$(sudo cat "/sys/fs/cgroup$CGP/cgroup.procs")" || stop "STOP2 run_scope_procs_unreadable"
          [ -z "$rp" ] || stop "STOP2 run_scope_root_not_empty"
          sc="$(sudo cat "/sys/fs/cgroup$CGP/cgroup.subtree_control")" || stop "STOP2 run_scope_unreadable"
          case " $sc " in *" memory "*) ;; *) stop "STOP2 run_scope_controller_missing memory" ;; esac
          case " $sc " in *" pids "*) ;; *) stop "STOP2 run_scope_controller_missing pids" ;; esac
          echo "STEP2 cgroup host_fs=cgroup2fs scope=$UNIT scope_path=$CGP host_cgroupns=$hcns engines_fs=cgroup2fs engines_self=init engines_view=match scope_root_procs=0 subtree_has=memory,pids"
          info="$(dk info --format '{{.DockerRootDir}}|{{.Driver}}|{{.Containers}}|{{.Images}}|{{.CgroupDriver}}|{{.CgroupVersion}}')" || stop "STOP2 engine_query"
          [ "$info" = "/var/lib/pf530/docker|overlay2|0|0|cgroupfs|2" ] || stop "STOP2 dedicated_engine_state"
          vols="$(dk volume ls -q)" || stop "STOP2 engine_query"
          [ -z "$vols" ] || stop "STOP2 dedicated_engine_not_empty"
          nets="$(dk network ls --format '{{.Name}}' | sort | tr '\n' ' ')" || stop "STOP2 engine_query"
          [ "$nets" = "bridge host none " ] || stop "STOP2 dedicated_engine_networks"
          # 2f. the test user reaches the dedicated engine and cannot reach the host engine sockets
          set +e; as_user python3 -I - sockets "$SOCKP" "$(cat "$RT/ns_ino")" < "$RT/probe.py"; rc=$?; set -e
          case "$rc" in 0) ;; 3) stop "STOP2 socket_access_not_as_declared" ;; *) stop "STOP2 socket_probe_tool_error rc=$rc" ;; esac
          # 2g. load the verified image (no network involved)
          loaded="$(dk load -i "$RT/fetch/img/image.tar")" || stop "STOP2 image_load"
          echo "STEP2 $loaded"
          exp="$(cat "$RT/fetch/img/expected_image_id")"
          got="$(dk image inspect --format '{{.Id}}' "$IMAGE_NAME:$PG_PIN")" || stop "STOP2 image_inspect"
          [ "$got" = "$exp" ] || stop "STOP2 loaded_image_id_mismatch"
          cnt="$(dk image ls -q --no-trunc | sort -u | wc -l)" || stop "STOP2 engine_query"
          [ "$cnt" = "1" ] || stop "STOP2 unexpected_image_count $cnt"
          echo "STEP2 loaded_image_id=$got (equals the verified config digest)"
          # 2h. the project network the CLI will reuse (it creates one only if absent), bound to loopback by its own option
          nid="$(dk network create --driver bridge -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            --label "com.supabase.cli.project=$PROJ" --label "com.docker.compose.project=$PROJ" "$NET")" || stop "STOP2 network_create"
          led "network pf530 id=$nid"
          ncfg="$(dk network inspect --format '{{.Name}}|{{.Driver}}|{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}|{{.Internal}}' "$nid")" || stop "STOP2 network_inspect"
          echo "STEP2 network id=$nid config=$ncfg"
          [ "$ncfg" = "$NET|bridge|127.0.0.1|false" ] || stop "STOP2 network_not_as_declared"
          probe post_engine STOP2
          echo "STEP2 engine_ready cgroup_version=2 cgroup_driver=cgroupfs scope=$UNIT (engine readiness only; no database started)"

      # ------------------------------------------------------------------ 3. official init + declared configuration
      - name: 3-configure
        timeout-minutes: 3
        run: |
          . "$RUNNER_TEMP/lib.sh"
          : > "$RT/init.log" || stop "STOP3 evidence_unwritable"
          set +e; as_user sh -c 'cd "$1" && exec supabase-pf init' sh "$W" >> "$RT/init.log" 2>&1; rc=$?; set -e
          if [ "$rc" != "0" ]; then python3 -I "$RT/diag.py" log "$RT/init.log" init || true; stop "STOP3 init_failed rc=$rc"; fi
          set +e; sudo python3 -I "$RT/cfg.py" patch "$W" "$PROJ"; rc=$?; set -e
          case "$rc" in 0) ;; 3) stop "STOP3 config_not_as_declared" ;; *) stop "STOP3 config_tool_error rc=$rc" ;; esac
          as_user sh -c 'mkdir -p "$1/supabase/.temp" && printf "%s\n" "$2" > "$1/supabase/.temp/postgres-version"' sh "$W" "$PG_PIN" || stop "STOP3 version_pin_write"
          set +e; sudo env PG_PIN="$PG_PIN" python3 -I "$RT/cfg.py" inputs "$W" "$PROJ"; rc=$?; set -e
          case "$rc" in 0) ;; 3) stop "STOP3 inputs_not_empty" ;; *) stop "STOP3 inputs_tool_error rc=$rc" ;; esac

      # ------------------------------------------------------------------ 4. official entry point
      - name: 4-db-start
        timeout-minutes: 12
        run: |
          . "$RUNNER_TEMP/lib.sh"
          LOG="$RT/db_start.log"
          : > "$LOG" || stop "STOP4 evidence_unwritable"
          exp_ns="net:[$(cat "$RT/ns_ino")]"
          # the guard runs inside the same call, before the official tool: it writes its evidence to the log channel
          # opened by this step and refuses to start on a read error, a write error or a different namespace
          set +e
          as_user sh -c 'g="$(readlink /proc/self/ns/net)" || { echo "PF_GUARD read_error" || true; exit 97; }
            echo "PF_GUARD netns=$g" || exit 95
            [ "$g" = "$2" ] || { echo "PF_GUARD mismatch" || true; exit 98; }
            cd "$1" || { echo "PF_GUARD workdir_error" || true; exit 96; }
            echo "PF_GUARD start" || exit 95
            exec timeout 600 supabase-pf db start' sh "$W" "$exp_ns" >> "$LOG" 2>&1
          rc=$?
          set -e
          [ -f "$LOG" ] || stop "STOP4 evidence_missing"
          l1="$(sed -n 1p "$LOG")"; l2="$(sed -n 2p "$LOG")"
          case "$l1" in "PF_GUARD "*) ;; *) l1="PF_GUARD absent" ;; esac
          case "$l2" in "PF_GUARD "*) ;; *) l2="PF_GUARD absent" ;; esac
          echo "STEP4 guard ${l1#PF_GUARD } / ${l2#PF_GUARD } exit=$rc"
          # A missing or misplaced start marker cannot prove whether an attempt began.
          [ "$l2" = "PF_GUARD start" ] || stop "STOP4 start_not_confirmed guard=${l2#PF_GUARD } rc=$rc"
          [ "$l1" = "PF_GUARD netns=$exp_ns" ] || stop "STOP4 started_guard_evidence_inconsistent"
          # started: from here on a nonzero exit is a failure of the started attempt
          python3 -I "$RT/diag.py" log "$LOG" db_start || stop "STOP4 diag_tool_error"
          if [ "$rc" != "0" ]; then
            dk ps -a --format 'STEP4 container name={{.Names}} state={{.State}}' || true
            [ "$rc" = "124" ] && stop "STOP4 db_start_timeout"
            stop "STOP4 db_start_failed rc=$rc"
          fi
          set +e; python3 -I "$RT/diag.py" activity "$LOG"; rc=$?; set -e
          case "$rc" in 0) ;; 3) stop "STOP4 migration_or_seed_activity" ;; *) stop "STOP4 activity_tool_error rc=$rc" ;; esac

      # ------------------------------------------------------------------ 5. identity + read-only measurement
      - name: 5-measure
        timeout-minutes: 4
        run: |
          . "$RUNNER_TEMP/lib.sh"
          exp="$(cat "$RT/fetch/img/expected_image_id")"
          nid="$(awk '$1 == "network" {sub(/^id=/, "", $3); print $3}' "$LEDGER")"
          all="$(dk ps -a --no-trunc --format '{{.ID}} {{.Names}} {{.Image}}')" || stop "STOP5 engine_query"
          echo "STEP5 containers_in_dedicated_engine:"; printf '%s\n' "$all"
          ids="$(printf '%s\n' "$all" | awk -v n="supabase_db_$PROJ" '$2 == n {print $1}')"
          set -- $ids
          [ "$#" = "1" ] || stop "STOP5 db_container_not_unique count=$#"
          CID="$1"; led "container pf530 id=$CID"
          meta="$(dk inspect --format '{{.Name}}|{{.Image}}|{{index .Config.Labels "com.supabase.cli.project"}}|{{.State.Running}}|{{.HostConfig.NetworkMode}}|{{.HostConfig.Privileged}}|{{.HostConfig.PidMode}}' "$CID")" || stop "STOP5 inspect"
          echo "STEP5 db_container id=$CID meta=$meta"
          [ "$meta" = "/supabase_db_$PROJ|$exp|$PROJ|true|$NET|false|" ] || stop "STOP5 db_container_identity"
          cgp="$(awk '$1 == "scope" {sub(/^cg=/, "", $3); print $3}' "$LEDGER")" || stop "STOP5 ledger_unreadable"
          cpid="$(dk inspect --format '{{.State.Pid}}' "$CID")" || stop "STOP5 inspect"
          ccg="$(sudo cat "/proc/$cpid/cgroup")" || stop "STOP5 db_container_process_gone"
          [ "$cgp" = "$CGP" ] && [ "$ccg" = "0::$CGP/docker/$CID" ] || stop "STOP5 db_container_outside_run_scope"
          echo "STEP5 db_container cgroup=run_scope/docker/CID within_run_scope=yes"
          attached="$(dk inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}={{$v.NetworkID}} {{end}}' "$CID")" || stop "STOP5 inspect"
          [ "$attached" = "$NET=$nid " ] || stop "STOP5 db_container_not_on_run_network"
          ncfg="$(dk network inspect --format '{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}' "$nid")" || stop "STOP5 network_inspect"
          [ "$ncfg" = "127.0.0.1" ] || stop "STOP5 network_binding_changed"
          ports="$(dk inspect --format '{{json .NetworkSettings.Ports}}' "$CID")" || stop "STOP5 inspect"
          python3 -I -c 'import json,sys; p=json.loads(sys.argv[1]) or {}; b=[x for v in p.values() for x in (v or [])]; print("STEP5 published", b); sys.exit(0 if b and all(x.get("HostIp")=="127.0.0.1" for x in b) else 3)' "$ports" || stop "STOP5 published_port_not_loopback_only"
          host_l="$(ss -ltnH)" || stop "STOP5 ss_host"
          ns_l="$(in_ns ss -ltnH)" || stop "STOP5 ss_test_netns"
          case "$host_l" in *":54322 "*) stop "STOP5 db_port_listening_in_host_namespace" ;; esac
          case "$ns_l" in *"127.0.0.1:54322 "*) ;; *) stop "STOP5 db_port_not_on_test_loopback" ;; esac
          echo "STEP5 db_port host_namespace=absent test_namespace=127.0.0.1:54322"
          probe post_start STOP5
          M="$RT/measure.txt"
          : > "$M" || stop "STOP5 evidence_unwritable"
          set +e
          dk exec -i -e PGPASSWORD=postgres "$CID" psql -h 127.0.0.1 -U postgres -d postgres -X -q -At -F ' | ' -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate < "$RT/measure.sql" >> "$M" 2> "$RT/measure.err"
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then python3 -I "$RT/diag.py" psql "$RT/measure.err" || true; stop "STOP5 measurement_query_failed rc=$rc"; fi
          set +e; python3 -I "$RT/compare.py" "$M"; rc=$?; set -e
          case "$rc" in 0) ;; 5) stop "STOP5 evidence_incomplete_or_invalid" ;; *) stop "STOP5 compare_tool_error rc=$rc" ;; esac

      # ------------------------------------------------------------------ 6. cleanup of ledger-proven resources only (always)
      - name: 6-cleanup
        if: always()
        timeout-minutes: 8
        run: |
          if [ ! -f "$RUNNER_TEMP/cleanup.py" ]; then echo "STEP6 helpers_absent no_resources_created"; exit 0; fi
          sudo python3 -I "$RUNNER_TEMP/cleanup.py" "$RUNNER_TEMP/ledger" "$RUNNER_TEMP"
